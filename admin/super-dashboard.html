<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Admin Portal - Al-Farha Cargo</title>
    
    <!-- STRICT AUTHENTICATION GATEKEEPER -->
    <script>
        (function checkAuth() {
            const token = localStorage.getItem('cargo_auth_token');
            const role = localStorage.getItem('cargo_user_role');
            if (!token) window.location.replace('../login.html');
            if (role !== 'super_admin' && role !== 'branch_admin') window.location.replace('../dashboard.html');
        })();
    </script>

    <!-- Tailwind CSS & Fonts -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Initialize Global Widget Registry First -->
    <script>
        window.CargoWidgetRegistry = [];
        window.registerCargoWidget = function(widgetConfig) {
            const idx = window.CargoWidgetRegistry.findIndex(w => w.id === widgetConfig.id);
            if (idx > -1) window.CargoWidgetRegistry[idx] = widgetConfig;
            else window.CargoWidgetRegistry.push(widgetConfig);
        };
    </script>

    <!-- Modular Layout Components -->
    <script src="components/sidebar.js" defer></script>
    <script src="components/topbar.js" defer></script>

    <!-- Modular Adaptive Widgets -->
    <script src="widgets/global-shipments.js" defer></script>
    <script src="widgets/global-financials.js" defer></script>
    <script src="widgets/sla-staff-status.js" defer></script>
    <script src="widgets/cargo-velocity.js" defer></script>
    <script src="widgets/branch-financials.js" defer></script>
    <script src="widgets/branch-pipeline.js" defer></script>
    <script src="widgets/branch-efficiency.js" defer></script>
    <script src="widgets/latest-bookings.js" defer></script>

    <!-- Smartphone Grid & Cloud Sync Engine -->
    <script src="widgets/widget-manager.js" defer></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
                    colors: {
                        coral: { 
                            50: '#FFF5F3',
                            100: '#FFE8E3',
                            200: '#FFD0C7',
                            300: '#F7A99A',
                            400: '#F08A76',
                            500: '#E86D58', 
                            600: '#D55C48' 
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #E5E7EB; border-radius: 10px; }
        .no-scrollbar::-webkit-scrollbar { display: none; }

        /* SMARTPHONE-STYLE 4-COLUMN DENSE BENTO GRID */
        .smart-widget-grid {
            display: grid;
            grid-template-columns: repeat(1, minmax(0, 1fr));
            grid-auto-rows: 185px;
            grid-auto-flow: dense;
            gap: 1.25rem;
        }
        @media (min-width: 768px) {
            .smart-widget-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
            .widget-cell {
                grid-column: span min(var(--w-cols, 1), 2);
                grid-row: span var(--w-rows, 2);
            }
        }
        @media (min-width: 1280px) {
            .smart-widget-grid {
                grid-template-columns: repeat(4, minmax(0, 1fr));
            }
            .widget-cell {
                grid-column: span var(--w-cols, 1);
                grid-row: span var(--w-rows, 2);
            }
        }
    </style>
</head>
<body class="bg-[#ECECEF] min-h-screen p-3 lg:p-5 flex gap-5 antialiased text-gray-900 selection:bg-coral-500 selection:text-white">

    <!-- Modular Sidebar -->
    <div id="sidebar-container" class="hidden lg:block z-20"></div>

    <!-- Main Outer Container -->
    <main class="flex-1 bg-white rounded-[2.5rem] shadow-[0_20px_60px_-15px_rgba(0,0,0,0.05)] p-6 lg:p-8 flex flex-col relative z-10 overflow-hidden border border-white">
        
        <!-- Topbar (Contains Top Greeting, Super Admin Portal Badge, Live Clock & Customize Controls) -->
        <div id="topbar-container"></div>

        <!-- Customize Mode Instruction Banner (Hidden unless Customize is clicked) -->
        <div id="customize-mode-banner" class="hidden items-center justify-between bg-[#111827] text-white px-5 py-3 rounded-2xl mb-5 shadow-md">
            <div class="flex items-center gap-3">
                <span class="w-2.5 h-2.5 rounded-full bg-coral-500 animate-ping"></span>
                <p class="text-xs font-semibold">
                    <span class="font-extrabold text-coral-400">Customize Mode Active:</span> Drag cards to reorder, click <span class="underline">2×2 / 2×3</span> pills or drag the bottom-right corner handle to resize. Changes sync to your account automatically.
                </p>
            </div>
            <button onclick="resetDefaultWidgets()" class="text-[11px] font-bold text-gray-300 hover:text-white underline flex-shrink-0 ml-4">
                Reset Default Grid
            </button>
        </div>

        <!-- Scrollable Dashboard Body -->
        <div class="flex-1 overflow-y-auto pr-1 custom-scrollbar">
            <section class="bg-[#F8F8FA] rounded-[2rem] p-4 lg:p-6 min-h-full">
                <!-- Smartphone Resizable & Draggable Bento Grid -->
                <div id="widgets-grid" class="smart-widget-grid">
                    <!-- Widgets injected dynamically by widgets/widget-manager.js -->
                </div>
            </section>
        </div>
    </main>

    <!-- ADD / REMOVE WIDGETS MODAL -->
    <div id="widget-modal" class="hidden fixed inset-0 z-50 bg-gray-900/40 backdrop-blur-sm items-center justify-center p-4">
        <div class="bg-white rounded-[2.5rem] max-w-xl w-full p-6 lg:p-8 shadow-2xl border border-gray-100 flex flex-col max-h-[85vh]">
            <div class="flex justify-between items-center pb-4 border-b border-gray-100">
                <div>
                    <h3 class="text-lg font-extrabold text-gray-900">Manage Dashboard Widgets</h3>
                    <p class="text-xs text-gray-400 mt-0.5">Add or remove modules from your Super Admin Portal.</p>
                </div>
                <button onclick="closeWidgetModal()" class="w-9 h-9 rounded-full bg-gray-50 hover:bg-gray-100 flex items-center justify-center text-gray-500">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>

            <!-- Dynamic Catalog List -->
            <div id="widget-catalog-list" class="flex-1 overflow-y-auto space-y-3 my-5 pr-1 custom-scrollbar"></div>

            <div class="flex justify-between items-center pt-4 border-t border-gray-100">
                <button onclick="resetDefaultWidgets()" class="text-xs font-bold text-gray-500 hover:text-gray-900 underline">
                    Reset to Default Layout
                </button>
                <button onclick="closeWidgetModal()" class="bg-[#111827] hover:bg-gray-800 text-white text-xs font-bold px-6 py-3 rounded-full transition-colors">
                    Done
                </button>
            </div>
        </div>
    </div>

</body>
</html>
