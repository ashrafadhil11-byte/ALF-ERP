<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Admin Dashboard - Al-Farha Cargo</title>
    
    <!-- STRICT AUTHENTICATION GATEKEEPER -->
    <script>
        (function checkAuth() {
            const token = localStorage.getItem('cargo_auth_token');
            const role = localStorage.getItem('cargo_user_role');
            if (!token) window.location.replace('../login.html');
            if (role !== 'super_admin' && role !== 'branch_admin') window.location.replace('../dashboard.html');
        })();
    </script>

    <!-- Tailwind CSS & Fonts -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Modular Layout Components -->
    <script src="components/sidebar.js" defer></script>
    <script src="components/topbar.js" defer></script>

    <!-- Modular Widget Engine & Individual Widget Files -->
    <script src="widgets/widget-manager.js" defer></script>
    <script src="widgets/global-shipments.js" defer></script>
    <script src="widgets/global-financials.js" defer></script>
    <script src="widgets/sla-staff-status.js" defer></script>
    <script src="widgets/cargo-velocity.js" defer></script>
    <script src="widgets/branch-financials.js" defer></script>
    <script src="widgets/branch-pipeline.js" defer></script>
    <script src="widgets/branch-efficiency.js" defer></script>
    <!-- NEW: Latest Bookings Widget -->
    <script src="widgets/latest-bookings.js" defer></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
                    colors: {
                        coral: { 
                            50: '#FFF5F3',
                            100: '#FFE8E3',
                            200: '#FFD0C7',
                            300: '#F7A99A',
                            400: '#F08A76',
                            500: '#E86D58', 
                            600: '#D55C48' 
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #E5E7EB; border-radius: 10px; }
    </style>
</head>
<body class="bg-[#ECECEF] min-h-screen p-3 lg:p-5 flex gap-5 antialiased text-gray-900 selection:bg-coral-500 selection:text-white">

    <!-- Modular Sidebar -->
    <div id="sidebar-container" class="hidden lg:block z-20"></div>

    <!-- Main Outer Container -->
    <main class="flex-1 bg-white rounded-[2.5rem] shadow-[0_20px_60px_-15px_rgba(0,0,0,0.05)] p-6 lg:p-8 flex flex-col relative z-10 overflow-hidden border border-white">
        
        <!-- Modular Topbar -->
        <div id="topbar-container"></div>

        <!-- Scrollable Dashboard Body -->
        <div class="flex-1 overflow-y-auto pr-1 custom-scrollbar">
            
            <!-- GREETING (LEFT) & DATE/TIME + WIDGET CONTROLS (RIGHT) -->
            <section class="flex flex-col xl:flex-row xl:items-center justify-between pb-8 mb-6 border-b border-gray-100 gap-6">
                
                <!-- Left: Personalized User Greeting -->
                <div class="text-left">
                    <p class="text-lg lg:text-xl font-medium text-gray-400 tracking-tight leading-snug" id="greetingText">
                        Good Afternoon,
                    </p>
                    <h1 class="text-3xl lg:text-4xl font-extrabold text-gray-900 tracking-tight leading-tight mt-0.5" id="userFullName">
                        Muhammed Adhil
                    </h1>
                </div>

                <!-- Right: Widget Controls + Today's Date & Live Time -->
                <div class="flex flex-wrap items-center gap-3 self-start xl:self-center">
                    
                    <!-- Add / Remove Widgets Modal Trigger -->
                    <button onclick="openWidgetModal()" class="bg-white hover:bg-gray-50 text-gray-800 px-4 py-3 rounded-full border border-gray-200/80 text-xs font-bold flex items-center gap-2 shadow-sm transition-all">
                        <svg class="w-4 h-4 text-coral-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"></path></svg>
                        <span>Widgets</span>
                        <span id="active-widget-count" class="bg-[#F8F8FA] text-gray-600 px-2 py-0.5 rounded-full text-[10px] border border-gray-100">7/7</span>
                    </button>

                    <!-- Inline Edit Mode Trigger -->
                    <button id="editLayoutBtn" onclick="toggleEditLayoutMode()" class="bg-[#F8F8FA] hover:bg-gray-100 text-gray-700 px-4 py-3 rounded-full border border-gray-100 text-xs font-bold flex items-center gap-2 transition-all">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"></path></svg>
                        Customize
                    </button>

                    <!-- Date & Live Time Pill -->
                    <div class="flex items-center gap-5 bg-[#F8F8FA] px-5 py-2.5 rounded-[2rem] border border-gray-100">
                        <div class="text-right pr-5 border-r border-gray-200/80">
                            <p class="text-lg lg:text-xl font-extrabold text-gray-900 tracking-tight tabular-nums leading-none" id="currentTime">
                                --:-- --
                            </p>
                            <p class="text-[10px] font-bold text-coral-500 uppercase tracking-widest mt-1">
                                Local Time
                            </p>
                        </div>

                        <div class="flex items-center gap-3">
                            <div class="w-11 h-11 rounded-full bg-white border border-gray-200/80 flex items-center justify-center shadow-sm">
                                <span class="text-base font-extrabold text-gray-900 tracking-tight leading-none" id="currentDay">--</span>
                            </div>
                            <div class="text-left pr-1">
                                <p class="text-xs font-bold text-gray-900 leading-tight" id="currentDayName">---</p>
                                <p class="text-xs font-medium text-gray-400 leading-tight mt-0.5" id="currentMonthYear">---</p>
                            </div>
                        </div>
                    </div>

                </div>
            </section>

            <!-- DYNAMIC WIDGETS CANVAS -->
            <section class="bg-[#F8F8FA] rounded-[2rem] p-4 lg:p-6">
                <div id="widgets-grid" class="grid grid-cols-12 gap-5">
                    <!-- Widgets are injected dynamically by widgets/widget-manager.js -->
                </div>
            </section>
            
        </div>
    </main>

    <!-- ADD / REMOVE WIDGETS MODAL -->
    <div id="widget-modal" class="hidden fixed inset-0 z-50 bg-gray-900/40 backdrop-blur-sm items-center justify-center p-4">
        <div class="bg-white rounded-[2.5rem] max-w-xl w-full p-6 lg:p-8 shadow-2xl border border-gray-100 flex flex-col max-h-[85vh]">
            <div class="flex justify-between items-center pb-4 border-b border-gray-100">
                <div>
                    <h3 class="text-lg font-extrabold text-gray-900">Manage Dashboard Widgets</h3>
                    <p class="text-xs text-gray-400 mt-0.5">Add or remove modules from your Super Admin view.</p>
                </div>
                <button onclick="closeWidgetModal()" class="w-9 h-9 rounded-full bg-gray-50 hover:bg-gray-100 flex items-center justify-center text-gray-500">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>

            <!-- Dynamic Catalog List -->
            <div id="widget-catalog-list" class="flex-1 overflow-y-auto space-y-3 my-5 pr-1 custom-scrollbar"></div>

            <div class="flex justify-between items-center pt-4 border-t border-gray-100">
                <button onclick="resetDefaultWidgets()" class="text-xs font-bold text-gray-500 hover:text-gray-900 underline">
                    Reset to Default Layout
                </button>
                <button onclick="closeWidgetModal()" class="bg-[#111827] hover:bg-gray-800 text-white text-xs font-bold px-6 py-3 rounded-full transition-colors">
                    Done
                </button>
            </div>
        </div>
    </div>

    <!-- User Greeting & Live Clock Script -->
    <script>
        (function populateUserName() {
            let fullName = localStorage.getItem('cargo_user_name') || 'Muhammed Adhil';
            try {
                const token = localStorage.getItem('cargo_auth_token');
                if (token) {
                    const base64Url = token.split('.')[1];
                    const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
                    const payload = JSON.parse(window.atob(base64));
                    if (payload?.user_metadata?.full_name) {
                        fullName = payload.user_metadata.full_name;
                        localStorage.setItem('cargo_user_name', fullName);
                    }
                }
            } catch (e) {}
            document.getElementById('userFullName').textContent = fullName;
        })();

        function updateDateTimeAndGreeting() {
            const now = new Date();
            const hour = now.getHours();
            
            let greeting = 'Good Evening,';
            if (hour < 12) greeting = 'Good Morning,';
            else if (hour < 17) greeting = 'Good Afternoon,';
            
            document.getElementById('greetingText').textContent = greeting;
            document.getElementById('currentDay').textContent = String(now.getDate()).padStart(2, '0');
            document.getElementById('currentDayName').textContent = now.toLocaleDateString('en-US', { weekday: 'long' });
            document.getElementById('currentMonthYear').textContent = now.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
            document.getElementById('currentTime').textContent = now.toLocaleTimeString('en-US', { 
                hour: '2-digit', 
                minute: '2-digit',
                second: '2-digit',
                hour12: true 
            });
        }

        updateDateTimeAndGreeting();
        setInterval(updateDateTimeAndGreeting, 1000);
    </script>
</body>
</html>
