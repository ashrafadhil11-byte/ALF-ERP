<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create User - Al-Farha Cargo ERP</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'], },
                    colors: {
                        brand: {
                            orange: '#F58220', orangeHover: '#E06D10',
                            purple: '#6A2C70', purpleDark: '#4A1D4E',
                        }
                    },
                    boxShadow: {
                        'soft': '0 20px 40px -15px rgba(0,0,0,0.05)',
                        'glow': '0 10px 25px -5px rgba(245, 130, 32, 0.4)'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-[#FBF8F1] min-h-screen flex items-center justify-center p-6 antialiased selection:bg-brand-orange selection:text-white">

    <div class="max-w-4xl w-full bg-white rounded-[2.5rem] shadow-soft overflow-hidden flex flex-col md:flex-row relative z-10">
        
        <!-- Left Branding Panel -->
        <div class="w-full md:w-5/12 bg-gradient-to-br from-brand-purple to-brand-purpleDark p-10 flex flex-col justify-between text-white relative overflow-hidden hidden md:flex">
            <div class="relative z-10">
                <div class="mb-8">
                    <img src="assets/LOGO%20BG%20B.svg" alt="Al-Farha Cargo Logo" class="h-12 w-auto object-contain">
                </div>
                <div>
                    <h1 class="text-3xl font-extrabold leading-tight mb-4">
                        Add New <br><span class="text-brand-orange">Team Member</span>
                    </h1>
                    <p class="text-purple-200 text-sm leading-relaxed">
                        Create secure access credentials for employees to access the Al-Farha Cargo ERP system.
                    </p>
                </div>
            </div>
            
            <!-- Dashboard Link -->
            <a href="dashboard.html" class="relative z-10 flex items-center gap-2 text-sm text-purple-300 hover:text-white transition-colors mt-8">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                Back to Dashboard
            </a>
        </div>

        <!-- Right Form Panel -->
        <div class="w-full md:w-7/12 p-8 sm:p-12 flex flex-col justify-center bg-white relative">
            
            <div class="mb-6 md:hidden flex justify-between items-center">
                <img src="assets/LOGO%20BG%20B.svg" alt="Al-Farha Cargo Logo" class="h-8 w-auto object-contain">
                <a href="dashboard.html" class="text-sm text-gray-500 hover:text-brand-orange">Cancel</a>
            </div>

            <div class="max-w-md w-full mx-auto">
                <h2 class="text-2xl font-bold text-gray-900 mb-1">Create Account</h2>
                <p class="text-gray-500 text-sm mb-8">Set up a new user for the logistics portal.</p>

                <form id="createUserForm" class="space-y-5">
                    
                    <!-- Alert Messages -->
                    <div id="alertMsg" class="hidden text-sm p-4 rounded-xl border flex items-center gap-2 mb-4"></div>

                    <!-- Full Name -->
                    <div class="space-y-1.5">
                        <label class="text-xs font-semibold text-gray-700 ml-1">Full Name</label>
                        <input type="text" id="fullName" required placeholder="e.g. John Doe" 
                            class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-brand-orange focus:border-transparent text-sm transition-all duration-200">
                    </div>

                    <!-- Grid for Username and Role -->
                    <div class="grid grid-cols-2 gap-4">
                        <div class="space-y-1.5">
                            <label class="text-xs font-semibold text-gray-700 ml-1">Username</label>
                            <input type="text" id="username" required placeholder="e.g. jdoe" 
                                class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-brand-orange focus:border-transparent text-sm transition-all duration-200">
                        </div>
                        <div class="space-y-1.5">
                            <label class="text-xs font-semibold text-gray-700 ml-1">Account Role</label>
                            <select id="role" class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-gray-900 focus:outline-none focus:ring-2 focus:ring-brand-orange focus:border-transparent text-sm transition-all duration-200 appearance-none">
                                <option value="agent">Cargo Agent</option>
                                <option value="manager">Manager</option>
                                <option value="driver">Driver</option>
                                <option value="admin">Administrator</option>
                            </select>
                        </div>
                    </div>

                    <!-- Password -->
                    <div class="space-y-1.5">
                        <label class="text-xs font-semibold text-gray-700 ml-1">Temporary Password</label>
                        <input type="password" id="password" required placeholder="••••••••" minlength="6"
                            class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-brand-orange focus:border-transparent text-sm transition-all duration-200">
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" id="submitBtn" 
                        class="w-full bg-brand-orange hover:bg-brand-orangeHover text-white font-semibold py-3.5 px-4 rounded-xl shadow-glow transition-all duration-300 flex justify-center items-center gap-2 group transform active:scale-[0.98] mt-4">
                        <span id="btnText">Create User</span>
                        <svg id="btnLoader" class="w-5 h-5 animate-spin hidden" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                        </svg>
                    </button>
                </form>

            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById('createUserForm');
        const submitBtn = document.getElementById('submitBtn');
        const btnText = document.getElementById('btnText');
        const btnLoader = document.getElementById('btnLoader');
        const alertMsg = document.getElementById('alertMsg');

        function showAlert(type, message) {
            alertMsg.className = `text-sm p-4 rounded-xl border flex items-center gap-2 mb-4 ${
                type === 'success' 
                ? 'bg-green-50 text-green-700 border-green-100' 
                : 'bg-red-50 text-red-600 border-red-100'
            }`;
            
            const icon = type === 'success' 
                ? `<svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>`
                : `<svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>`;
                
            alertMsg.innerHTML = `${icon} <span>${message}</span>`;
            alertMsg.classList.remove('hidden');
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const fullName = document.getElementById('fullName').value;
            const username = document.getElementById('username').value;
            const role = document.getElementById('role').value;
            const password = document.getElementById('password').value;

            // Loading state
            submitBtn.disabled = true;
            btnText.textContent = 'Creating...';
            btnLoader.classList.remove('hidden');
            alertMsg.classList.add('hidden');

            try {
                const response = await fetch('/api/create-user', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ fullName, username, role, password })
                });

                const result = await response.json();

                if (!response.ok) {
                    throw new Error(result.error || 'Failed to create user');
                }

                showAlert('success', `User <b>${username}</b> created successfully!`);
                form.reset();

            } catch (error) {
                showAlert('error', error.message);
            } finally {
                submitBtn.disabled = false;
                btnText.textContent = 'Create User';
                btnLoader.classList.add('hidden');
            }
        });
    </script>
</body>
</html>
