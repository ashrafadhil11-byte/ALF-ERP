<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shipments - Al-Farha Cargo</title>
    <script>
        (function checkAuth() {
            if (!localStorage.getItem('cargo_auth_token')) window.location.replace('../login.html');
        })();
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="components/sidebar.js" defer></script>
    <script src="components/topbar.js" defer></script>
    <script src="components/profile-modal.js" defer></script>
    <script>
        tailwind.config = {
            theme: { extend: {
                fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
                colors: { coral: { 50: '#FFF5F3', 100: '#FFE8E3', 200: '#FFD0C7', 300: '#F7A99A', 400: '#F08A76', 500: '#E86D58', 600: '#D55C48' } }
            } }
        }
    </script>
    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 4px; height: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #E5E7EB; border-radius: 10px; }
        .field { width: 100%; padding: .7rem 1rem; background: #F9FAFB; border: 1px solid #E5E7EB; border-radius: .9rem; font-size: .8rem; }
        .field:focus { outline: none; box-shadow: 0 0 0 2px #E86D58; border-color: transparent; }
        .scan { font-size: 1rem; font-weight: 800; letter-spacing: .03em; background: #fff; }
        .seg button[aria-pressed="true"] { background: #111827; color: #fff; }
    </style>
</head>
<body class="bg-[#ECECEF] min-h-screen p-3 lg:p-5 flex gap-5 antialiased text-gray-900">
    <div id="sidebar-container" class="hidden lg:block z-20"></div>

    <main class="flex-1 min-w-0 bg-white rounded-[2.5rem] shadow-[0_20px_60px_-15px_rgba(0,0,0,0.05)] p-5 lg:p-8 flex flex-col relative z-10 overflow-hidden border border-white">
        <div id="topbar-container"></div>

        <div class="flex-1 overflow-y-auto pr-1 custom-scrollbar">
            <section class="flex flex-wrap items-center justify-between pb-6 mb-6 border-b border-gray-100 gap-3">
                <div class="flex items-center gap-3.5 bg-[#F8F8FA] p-1.5 pr-5 rounded-full border border-gray-200/70 shadow-sm">
                    <div class="w-10 h-10 rounded-full bg-[#111827] text-white flex items-center justify-center">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"></path></svg>
                    </div>
                    <div>
                        <div class="flex items-center gap-2"><span class="text-xs font-extrabold tracking-tight">Shipments & AWB</span><span class="w-1.5 h-1.5 rounded-full bg-coral-500"></span></div>
                        <p id="scopeLabel" class="text-[10px] font-medium text-gray-400 leading-tight mt-0.5">Import • Scan & update • Track</p>
                    </div>
                </div>
                <div id="alert" class="hidden text-xs font-bold px-4 py-2.5 rounded-full border"></div>
            </section>

            <section class="grid grid-cols-1 xl:grid-cols-2 gap-5 mb-5">
                <!-- IMPORT -->
                <div class="bg-[#F8F8FA] rounded-[2rem] p-5 lg:p-6 flex flex-col gap-4">
                    <div class="flex flex-wrap items-center justify-between gap-2">
                        <div class="flex items-center gap-2"><span class="font-extrabold text-xs uppercase tracking-wider">Import from Al-Farha Online</span><span class="w-2 h-2 rounded-full bg-coral-500"></span></div>
                        <div class="seg flex bg-white rounded-full p-1 border border-gray-200/70 text-[11px] font-bold" role="group" aria-label="How the parcel arrives">
                            <button type="button" data-intake="drop_off" aria-pressed="true" class="px-3 py-1.5 rounded-full">Drop-off</button>
                            <button type="button" data-intake="pickup" aria-pressed="false" class="px-3 py-1.5 rounded-full">Pickup</button>
                        </div>
                    </div>
                    <label id="importBranchWrap" class="hidden"><span class="text-[11px] font-bold text-gray-500">Receiving branch</span>
                        <select id="importBranch" class="field mt-1 bg-white"></select>
                    </label>
                    <form id="importForm" class="flex gap-2">
                        <input id="importInput" class="field scan" placeholder="Scan order no." autocomplete="off" aria-label="Order number">
                        <button class="bg-[#111827] hover:bg-gray-800 text-white text-xs font-bold px-5 rounded-full flex-shrink-0">Import</button>
                    </form>
                    <details class="text-xs">
                        <summary class="cursor-pointer font-bold text-gray-500">Bulk: paste a list of order numbers</summary>
                        <textarea id="bulkInput" rows="4" class="field mt-2 bg-white" placeholder="One per line, or separated by commas"></textarea>
                        <button id="bulkBtn" type="button" class="mt-2 bg-white hover:bg-gray-50 border border-gray-200 text-xs font-bold px-5 py-2.5 rounded-full">Import list</button>
                    </details>
                    <div>
                        <div class="flex justify-between items-center mb-2"><p class="text-[10px] font-extrabold text-gray-400 uppercase">This session</p><span id="importCount" class="text-[10px] font-bold text-gray-500"></span></div>
                        <ul id="importLog" class="space-y-2 max-h-56 overflow-y-auto custom-scrollbar" aria-live="polite">
                            <li class="text-xs text-gray-400">Scanned orders appear here.</li>
                        </ul>
                    </div>
                </div>

                <!-- STATUS UPDATE -->
                <div class="bg-[#F8F8FA] rounded-[2rem] p-5 lg:p-6 flex flex-col gap-4">
                    <div class="flex items-center gap-2"><span class="font-extrabold text-xs uppercase tracking-wider">Scan & Update Status</span><span class="w-2 h-2 rounded-full bg-coral-500"></span></div>
                    <form id="scanForm" class="flex gap-2">
                        <input id="scanInput" class="field scan" placeholder="Scan AWB" autocomplete="off" aria-label="AWB">
                        <button class="bg-white hover:bg-gray-50 border border-gray-200 text-xs font-bold px-5 rounded-full flex-shrink-0">Add</button>
                    </form>
                    <div class="flex flex-wrap gap-1.5 min-h-[34px]" id="batch"></div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <label><span class="text-[11px] font-bold text-gray-500">New status</span><select id="statusSelect" class="field mt-1 bg-white"></select></label>
                        <label><span class="text-[11px] font-bold text-gray-500">Date & time</span><input id="eventAt" type="datetime-local" class="field mt-1 bg-white"></label>
                    </div>
                    <div id="extraFields" class="grid grid-cols-1 sm:grid-cols-2 gap-3"></div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <label><span class="text-[11px] font-bold text-gray-500">Location (optional)</span><input id="location" class="field mt-1 bg-white" placeholder="Defaults to your branch"></label>
                        <label><span class="text-[11px] font-bold text-gray-500">Remark <span id="remarkReq" class="text-coral-500 hidden">required</span></span><input id="remark" class="field mt-1 bg-white"></label>
                    </div>
                    <button id="updateBtn" type="button" disabled class="bg-coral-500 hover:bg-coral-600 disabled:opacity-40 text-white text-sm font-extrabold py-3.5 rounded-full shadow-sm">Update 0 shipments</button>
                </div>
            </section>

            <!-- LIST -->
            <section class="bg-[#F8F8FA] rounded-[2rem] p-4 lg:p-6">
                <div class="flex flex-wrap gap-2 items-center justify-between mb-4">
                    <div class="flex items-center gap-2"><span class="font-extrabold text-xs uppercase tracking-wider">Shipments</span><span id="listCount" class="text-[10px] font-bold bg-white border border-gray-100 px-2.5 py-1 rounded-full">…</span></div>
                    <div class="flex flex-wrap gap-2">
                        <input id="search" type="search" placeholder="Search AWB, name, country…" class="field bg-white !w-56 !rounded-full">
                        <select id="statusFilter" class="field bg-white !w-48 !rounded-full"><option value="">All statuses</option></select>
                        <select id="branchFilter" class="hidden field bg-white !w-40 !rounded-full"></select>
                        <button id="addSelectedBtn" type="button" class="bg-[#111827] text-white text-xs font-bold px-4 rounded-full">Add selected to batch</button>
                    </div>
                </div>
                <div class="bg-white rounded-[1.5rem] border border-gray-100 overflow-x-auto custom-scrollbar">
                    <table class="w-full text-xs min-w-[760px]">
                        <thead><tr class="text-[10px] text-gray-400 uppercase text-left border-b border-gray-100">
                            <th class="p-3 w-8"><input type="checkbox" id="selectAll" aria-label="Select all" class="accent-[#E86D58]"></th>
                            <th class="p-3 font-extrabold">AWB</th><th class="p-3 font-extrabold">Branch</th><th class="p-3 font-extrabold">Shipper → Consignee</th>
                            <th class="p-3 font-extrabold">Destination</th><th class="p-3 font-extrabold text-right">Wt / Pcs</th>
                            <th class="p-3 font-extrabold">Status</th><th class="p-3 font-extrabold text-right">Booked</th>
                        </tr></thead>
                        <tbody id="rows" class="divide-y divide-gray-100"><tr><td colspan="8" class="p-8 text-center text-gray-400">Loading…</td></tr></tbody>
                    </table>
                </div>
            </section>
        </div>
    </main>

    <!-- DETAIL DRAWER -->
    <div id="drawer" class="hidden fixed inset-0 z-50 bg-gray-900/40 backdrop-blur-sm justify-end" onclick="if(event.target===this)closeDrawer()">
        <aside class="bg-white w-full max-w-md h-full p-6 lg:p-8 overflow-y-auto custom-scrollbar rounded-l-[2.5rem] shadow-2xl" aria-label="Shipment details">
            <div id="drawerBody"></div>
        </aside>
    </div>

    <script>
        const token = localStorage.getItem('cargo_auth_token');
        const role = localStorage.getItem('cargo_user_role') || 'staff';
        const isAdmin = role === 'super_admin' || role === 'head_office';
        const STAGES = ['', 'Booking', 'Pickup', 'Origin', 'Export', 'Transit', 'Destination', 'Last Mile', 'Delivered', 'Review'];
        const EXTRA = {
            agent_docket: [['fwd_agent', 'Forwarding agent'], ['fwd_docket', 'Agent docket / AWB']],
            to_branch: [['to_branch', 'To branch']],
            mawb: [['mawb', 'MAWB number']],
            driver: [['driver', 'Driver']]
        };
        const esc = (v) => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        const clean = (v) => String(v || '').trim().replace(/^'/, '').replace(/\s+/g, '').toUpperCase();
        let statuses = [], batch = [], intake = 'drop_off', imported = 0;

        async function api(path, opts = {}) {
            const res = await fetch(path, {
                ...opts,
                headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
                body: opts.body ? JSON.stringify(opts.body) : undefined
            });
            if (res.status === 401) { localStorage.removeItem('cargo_auth_token'); location.replace('../login.html'); }
            const data = await res.json().catch(() => ({}));
            if (!res.ok) throw new Error(data.error || `Request failed (${res.status})`);
            return data;
        }

        function flash(ok, msg) {
            const el = document.getElementById('alert');
            el.className = `text-xs font-bold px-4 py-2.5 rounded-full border ${ok ? 'bg-emerald-50 text-emerald-700 border-emerald-100' : 'bg-coral-50 text-coral-600 border-coral-100'}`;
            el.textContent = msg;
            clearTimeout(flash.t); flash.t = setTimeout(() => el.classList.add('hidden'), 6000);
        }
        function beep(ok) { // audible scan feedback, like the old scanner
            try { const a = new AudioContext(), o = a.createOscillator(); o.frequency.value = ok ? 880 : 220; o.connect(a.destination); o.start(); o.stop(a.currentTime + 0.12); } catch (e) {}
        }

        // ---------- Import ----------
        document.querySelectorAll('[data-intake]').forEach(b => b.onclick = () => {
            intake = b.dataset.intake;
            document.querySelectorAll('[data-intake]').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
        });

        function logImport(r) {
            const log = document.getElementById('importLog');
            if (!imported && log.firstElementChild?.classList.contains('text-gray-400')) log.innerHTML = '';
            imported++;
            const icon = r.result === 'imported' ? ['bg-emerald-50 text-emerald-700', 'Imported'] : r.result === 'refreshed' ? ['bg-amber-50 text-amber-700', 'Already in — refreshed'] : ['bg-coral-50 text-coral-600', 'Failed'];
            log.insertAdjacentHTML('afterbegin', `
                <li class="bg-white rounded-2xl px-4 py-2.5 border border-gray-100 flex justify-between items-center gap-3">
                    <div class="min-w-0">
                        <p class="text-xs font-extrabold">${esc(r.awb || r.order_no)}</p>
                        <p class="text-[10px] text-gray-400 truncate">${r.result === 'error' ? esc(r.error) : `${esc(r.consignee || '—')} • ${esc(r.dest_country || '—')} • ${esc(r.weight ?? '—')} kg / ${esc(r.pieces ?? 1)} pcs`}</p>
                    </div>
                    <span class="text-[10px] font-bold px-2.5 py-1 rounded-full flex-shrink-0 ${icon[0]}">${icon[1]}</span>
                </li>`);
            document.getElementById('importCount').textContent = `${imported} scanned`;
        }

        async function importOrders(list) {
            const orders = [...new Set(list.map(clean).filter(Boolean))];
            if (!orders.length) return;
            const branch = document.getElementById('importBranch').value;
            if (isAdmin && !branch) return flash(false, 'Choose the receiving branch first.');
            for (let i = 0; i < orders.length; i += 5) { // small chunks keep each request fast
                try {
                    const { results } = await api('/api/bookings', { method: 'POST', body: { action: 'import', order_nos: orders.slice(i, i + 5), branch, intake_mode: intake } });
                    results.forEach(r => { logImport(r); beep(r.result !== 'error'); });
                } catch (e) { flash(false, e.message); beep(false); break; }
            }
            loadList();
        }

        document.getElementById('importForm').onsubmit = (e) => {
            e.preventDefault();
            const input = document.getElementById('importInput');
            const v = input.value; input.value = ''; input.focus();
            importOrders([v]);
        };
        document.getElementById('bulkBtn').onclick = () => {
            const t = document.getElementById('bulkInput');
            importOrders(t.value.split(/[\s,;]+/)); t.value = '';
        };

        // ---------- Status update ----------
        function renderBatch() {
            document.getElementById('batch').innerHTML = batch.length
                ? batch.map(a => `<span class="bg-white border border-gray-200 rounded-full pl-3 pr-1 py-1 text-[11px] font-extrabold flex items-center gap-1">${esc(a)}
                    <button type="button" onclick="removeFromBatch('${esc(a)}')" aria-label="Remove ${esc(a)}" class="w-5 h-5 rounded-full hover:bg-coral-50 text-gray-400 hover:text-coral-600">×</button></span>`).join('')
                  + `<button type="button" onclick="batch=[];renderBatch()" class="text-[11px] font-bold text-gray-400 hover:text-gray-900 underline ml-1">Clear</button>`
                : '<span class="text-xs text-gray-400">No AWBs yet — scan, or tick rows below.</span>';
            const btn = document.getElementById('updateBtn');
            btn.disabled = !batch.length || !document.getElementById('statusSelect').value;
            btn.textContent = `Update ${batch.length} shipment${batch.length === 1 ? '' : 's'}`;
        }
        window.removeFromBatch = (a) => { batch = batch.filter(x => x !== a); renderBatch(); };
        function addToBatch(list) {
            list.map(clean).filter(Boolean).forEach(a => { if (!batch.includes(a)) batch.push(a); });
            renderBatch();
        }
        document.getElementById('scanForm').onsubmit = (e) => {
            e.preventDefault();
            const i = document.getElementById('scanInput');
            if (i.value.trim()) { addToBatch([i.value]); beep(true); }
            i.value = ''; i.focus();
        };

        function onStatusChange() {
            const st = statuses.find(s => s.code === document.getElementById('statusSelect').value);
            const req = st ? st.requires : [];
            document.getElementById('extraFields').innerHTML = req.flatMap(r => EXTRA[r] || []).map(([id, lbl]) =>
                `<label><span class="text-[11px] font-bold text-gray-500">${lbl} <span class="text-coral-500">required</span></span><input data-extra="${id}" required class="field mt-1 bg-white"></label>`).join('');
            document.getElementById('remarkReq').classList.toggle('hidden', !req.includes('remark'));
            renderBatch();
        }
        document.getElementById('statusSelect').onchange = onStatusChange;

        document.getElementById('updateBtn').onclick = async () => {
            const btn = document.getElementById('updateBtn');
            const body = {
                awbs: batch,
                code: document.getElementById('statusSelect').value,
                location: document.getElementById('location').value,
                remark: document.getElementById('remark').value,
                event_at: document.getElementById('eventAt').value ? new Date(document.getElementById('eventAt').value).toISOString() : undefined
            };
            document.querySelectorAll('[data-extra]').forEach(el => body[el.dataset.extra] = el.value.trim());
            btn.disabled = true; btn.textContent = 'Updating…';
            try {
                const r = await api('/api/status', { method: 'POST', body });
                flash(true, `${r.updated} shipment(s) → ${r.status}`); beep(true);
                batch = []; document.getElementById('remark').value = '';
                loadList();
            } catch (e) { flash(false, e.message); beep(false); }
            renderBatch();
        };

        // ---------- List ----------
        async function loadList() {
            const p = new URLSearchParams({ limit: '100' });
            const q = document.getElementById('search').value.trim();
            if (q) p.set('q', q);
            if (document.getElementById('statusFilter').value) p.set('status', document.getElementById('statusFilter').value);
            if (isAdmin && document.getElementById('branchFilter').value) p.set('branch', document.getElementById('branchFilter').value);
            try {
                const { bookings } = await api('/api/bookings?' + p);
                document.getElementById('listCount').textContent = `${bookings.length}${bookings.length === 100 ? '+' : ''}`;
                document.getElementById('rows').innerHTML = bookings.length ? bookings.map(b => `
                    <tr class="hover:bg-[#F8F8FA] cursor-pointer" onclick="openDrawer('${esc(b.awb)}')">
                        <td class="p-3" onclick="event.stopPropagation()"><input type="checkbox" class="rowSel accent-[#E86D58]" value="${esc(b.awb)}" aria-label="Select ${esc(b.awb)}"></td>
                        <td class="p-3 font-extrabold whitespace-nowrap">${esc(b.awb)}${b.intake_mode === 'pickup' ? ' <span class="text-[9px] font-bold text-coral-500">PICKUP</span>' : ''}</td>
                        <td class="p-3"><span class="text-[10px] font-bold bg-[#F8F8FA] border border-gray-100 px-2 py-0.5 rounded-full">${esc(b.branch_code || '—')}</span></td>
                        <td class="p-3 max-w-[220px] truncate">${esc(b.shipper || '—')} → <b>${esc(b.consignee || '—')}</b></td>
                        <td class="p-3 text-gray-500">${esc([b.dest_city, b.dest_country].filter(Boolean).join(', ') || '—')}</td>
                        <td class="p-3 text-right whitespace-nowrap">${esc(b.weight ?? '—')} kg / ${esc(b.pieces ?? '—')}</td>
                        <td class="p-3"><span class="text-[10px] font-bold px-2 py-0.5 rounded-full whitespace-nowrap ${b.current_stage >= 8 ? 'bg-emerald-50 text-emerald-700' : 'bg-coral-50 text-coral-600'}">${esc(b.current_status || 'New')}</span>
                            <span class="block text-[9px] text-gray-400 mt-0.5">${STAGES[b.current_stage] || ''}</span></td>
                        <td class="p-3 text-right text-gray-400 whitespace-nowrap">${new Date(b.booked_at).toLocaleDateString()}</td>
                    </tr>`).join('')
                    : '<tr><td colspan="8" class="p-8 text-center text-gray-400">No shipments yet. Scan an order number above to import it.</td></tr>';
                document.getElementById('selectAll').checked = false;
            } catch (e) { flash(false, e.message); }
        }
        let searchT;
        document.getElementById('search').oninput = () => { clearTimeout(searchT); searchT = setTimeout(loadList, 350); };
        document.getElementById('statusFilter').onchange = loadList;
        document.getElementById('branchFilter').onchange = loadList;
        document.getElementById('selectAll').onchange = (e) => document.querySelectorAll('.rowSel').forEach(c => c.checked = e.target.checked);
        document.getElementById('addSelectedBtn').onclick = () => {
            const sel = [...document.querySelectorAll('.rowSel:checked')].map(c => c.value);
            if (!sel.length) return flash(false, 'Tick some rows first.');
            addToBatch(sel); document.getElementById('scanInput').focus();
        };

        // ---------- Detail drawer ----------
        window.openDrawer = async (awb) => {
            const d = document.getElementById('drawer'); d.classList.remove('hidden'); d.classList.add('flex');
            const body = document.getElementById('drawerBody');
            body.innerHTML = '<p class="text-xs text-gray-400">Loading…</p>';
            try {
                const { booking: b, events } = await api('/api/bookings?awb=' + encodeURIComponent(awb));
                const row = (k, v) => v ? `<div class="flex justify-between gap-4 text-xs py-1.5"><span class="text-gray-400 font-bold">${k}</span><span class="font-bold text-right">${esc(v)}</span></div>` : '';
                body.innerHTML = `
                    <div class="flex justify-between items-start mb-5">
                        <div><p class="text-[10px] font-extrabold text-gray-400 uppercase">AWB</p><h3 class="text-2xl font-extrabold">${esc(b.awb)}</h3>
                        <span class="inline-block mt-1 text-[10px] font-bold px-2.5 py-1 rounded-full ${b.current_stage >= 8 ? 'bg-emerald-50 text-emerald-700' : 'bg-coral-50 text-coral-600'}">${esc(b.current_status || 'New')} • ${STAGES[b.current_stage] || ''}</span></div>
                        <button onclick="closeDrawer()" aria-label="Close" class="w-9 h-9 rounded-full bg-gray-50 hover:bg-gray-100 text-gray-500">×</button>
                    </div>
                    <div class="bg-[#F8F8FA] rounded-2xl p-4 border border-gray-100 divide-y divide-gray-100 mb-5">
                        ${row('Shipper', [b.shipper, b.shipper_phone].filter(Boolean).join(' • '))}
                        ${row('Consignee', [b.consignee, b.consignee_phone].filter(Boolean).join(' • '))}
                        ${row('Address', b.consignee_address)}
                        ${row('Route', `${[b.origin_city, b.origin_country].filter(Boolean).join(', ')} → ${[b.dest_city, b.dest_country].filter(Boolean).join(', ')}`)}
                        ${row('Package', `${b.package_type || '—'} • ${b.weight ?? '—'} kg • ${b.pieces ?? '—'} pcs`)}
                        ${row('Branch', b.branch_code)}
                        ${row('Intake', b.intake_mode === 'pickup' ? 'Driver pickup' : 'Branch drop-off')}
                        ${row('Forwarding', [b.fwd_agent, b.fwd_docket].filter(Boolean).join(' / '))}
                        ${row('Order no.', b.external_ref)}
                    </div>
                    <div class="flex justify-between items-center mb-3"><p class="text-[10px] font-extrabold text-gray-400 uppercase">Tracking timeline</p>
                        <button onclick="addToBatch(['${esc(b.awb)}']);closeDrawer();document.getElementById('statusSelect').focus()" class="text-[11px] font-bold text-coral-500">Update status →</button></div>
                    <ol class="relative border-l-2 border-gray-100 ml-2 space-y-4">
                        ${events.map((e, i) => `<li class="ml-4">
                            <span class="absolute -left-[7px] w-3 h-3 rounded-full ${i === 0 ? 'bg-coral-500' : 'bg-gray-300'}"></span>
                            <p class="text-xs font-extrabold">${esc(e.status)}</p>
                            <p class="text-[10px] text-gray-400">${new Date(e.event_at).toLocaleString()} • ${esc(e.location || '')} • ${esc(e.created_by_name || e.source)}</p>
                            ${e.remark ? `<p class="text-[11px] text-gray-600 mt-0.5">${esc(e.remark)}</p>` : ''}
                        </li>`).join('') || '<li class="ml-4 text-xs text-gray-400">No events.</li>'}
                    </ol>`;
            } catch (e) { body.innerHTML = `<p class="text-xs text-coral-600">${esc(e.message)}</p>`; }
        };
        window.closeDrawer = () => { const d = document.getElementById('drawer'); d.classList.add('hidden'); d.classList.remove('flex'); };
        document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDrawer(); });

        // ---------- Init ----------
        (async function init() {
            renderBatch();
            try {
                const { statuses: list } = await api('/api/status');
                statuses = list;
                const groups = {};
                list.forEach(s => (groups[s.is_exception ? 'Exceptions' : STAGES[s.stage]] ||= []).push(s));
                const opts = Object.entries(groups).map(([g, items]) => `<optgroup label="${esc(g)}">${items.map(s => `<option value="${esc(s.code)}">${esc(s.label)}</option>`).join('')}</optgroup>`).join('');
                document.getElementById('statusSelect').innerHTML = '<option value="">Choose status…</option>' + opts;
                document.getElementById('statusFilter').innerHTML = '<option value="">All statuses</option>' + opts;
            } catch (e) { flash(false, e.message); }
            if (isAdmin) {
                try {
                    const { branches } = await api('/api/branches');
                    const opts = branches.map(b => `<option value="${esc(b.branch_code)}">${esc(b.branch_name)} (${esc(b.branch_code)})</option>`).join('');
                    document.getElementById('importBranch').innerHTML = '<option value="">Choose branch…</option>' + opts;
                    document.getElementById('branchFilter').innerHTML = '<option value="">All branches</option>' + opts;
                    document.getElementById('importBranchWrap').classList.remove('hidden');
                    document.getElementById('branchFilter').classList.remove('hidden');
                } catch (e) { flash(false, e.message); }
            }
            loadList();
            document.getElementById('importInput').focus();
        })();
    </script>
</body>
</html>
