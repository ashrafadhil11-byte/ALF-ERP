<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#111827">
    <title>Offline - Al-Farha Cargo</title>
    <style>
        body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
               background: #ECECEF; font-family: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif; color: #111827; }
        .card { background: #fff; border-radius: 2.5rem; padding: 40px 32px; max-width: 360px; width: 100%; text-align: center;
                box-shadow: 0 20px 60px -15px rgba(0,0,0,.08); }
        .icon { width: 64px; height: 64px; border-radius: 9999px; background: #FFF5F3; color: #E86D58;
                display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; }
        h1 { font-size: 20px; font-weight: 800; margin: 0 0 8px; }
        p { font-size: 13px; color: #6B7280; line-height: 1.6; margin: 0 0 24px; }
        button { background: #111827; color: #fff; border: 0; border-radius: 9999px; padding: 12px 24px; font-weight: 800; font-size: 13px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 1l22 22M16.72 11.06A10.94 10.94 0 0119 12.55M5 12.55a10.94 10.94 0 015.17-2.39M10.71 5.05A16 16 0 0122.58 9M1.42 9a15.91 15.91 0 014.7-2.88M8.53 16.11a6 6 0 016.95 0M12 20h.01"/></svg>
        </div>
        <h1>You're offline</h1>
        <p>The ERP needs a connection to load live shipments and data. Check your internet and try again.</p>
        <button type="button" onclick="location.reload()">Try again</button>
    </div>
</body>
</html>
