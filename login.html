<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Al-Farha Cargo ERP</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            orange: '#F58220', 
                            orangeHover: '#E06D10',
                            purple: '#6A2C70', 
                            purpleDark: '#4A1D4E',
                            light: '#F8F9FA'
                        }
                    },
                    boxShadow: {
                        'soft': '0 20px 40px -15px rgba(0,0,0,0.05)',
                        'glow': '0 10px 25px -5px rgba(245, 130, 32, 0.4)'
                    }
                }
            }
        }
    </script>
    <style>
        input:-webkit-autofill,
        input:-webkit-autofill:hover, 
        input:-webkit-autofill:focus, 
        input:-webkit-autofill:active{
            -webkit-box-shadow: 0 0 0 30px #F9FAFB inset !important;
            -webkit-text-fill-color: #1F2937 !important;
            border-radius: 0.75rem;
        }
        
        .shape-1 { top: -20%; left: -10%; transform: rotate(45deg); }
        .shape-2 { bottom: -10%; right: -20%; border-radius: 50%; }
    </style>
</head>
<body class="bg-[#FBF8F1] min-h-screen flex items-center justify-center p-6 antialiased selection:bg-brand-orange selection:text-white">

    <div class="max-w-5xl w-full bg-white rounded-[2.5rem] shadow-soft overflow-hidden flex flex-col md:flex-row relative z-10">
        
        <!-- Left Branding Panel -->
        <div class="w-full md:w-5/12 bg-gradient-to-br from-brand-purple to-brand-purpleDark p-10 lg:p-14 flex flex-col justify-between text-white relative overflow-hidden hidden md:flex">
            <div class="absolute w-64 h-64 bg-white opacity-5 shape-1 z-0"></div>
            <div class="absolute w-80 h-80 bg-brand-orange opacity-10 shape-2 z-0"></div>
            
            <div class="relative z-10">
                <div class="mb-12">
                    <img src="assets/LOGO%20BG%20B.svg" alt="Al-Farha Cargo Logo" class="h-14 w-auto object-contain">
                </div>
                
                <div>
                    <h1 class="text-4xl lg:text-5xl font-extrabold leading-tight mb-4">
                        Logistics <br><span class="text-brand-orange">Simplified.</span>
                    </h1>
                    <p class="text-purple-200 text-lg leading-relaxed">
                        Access your advanced ERP & CRM dashboard to manage shipments, track progress, and oversee operations seamlessly.
                    </p>
                </div>
            </div>
            
            <div class="relative z-10">
                <div class="flex items-center gap-4 text-sm text-purple-300">
                    <span class="w-8 h-[1px] bg-purple-400"></span>
                    Secure Employee Portal
                </div>
            </div>
        </div>

        <!-- Right Login Form Panel -->
        <div class="w-full md:w-7/12 p-8 sm:p-12 lg:p-16 flex flex-col justify-center bg-white relative">
            
            <div class="mb-8 md:hidden">
                <img src="assets/LOGO%20BG%20B.svg" alt="Al-Farha Cargo Logo" class="h-10 w-auto object-contain">
            </div>

            <div class="max-w-md w-full mx-auto">
                <h2 class="text-3xl font-bold text-gray-900 mb-2">Welcome Back</h2>
                <p class="text-gray-500 mb-8">Please sign in to your account.</p>

                <form id="loginForm" class="space-y-6">
                    <!-- Error Message Container -->
                    <div id="errorMessage" class="hidden bg-red-50 text-red-600 text-sm p-3 rounded-xl border border-red-100 flex items-center gap-2">
                        <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                        <span id="errorText">Invalid credentials.</span>
                    </div>

                    <!-- Username Field (Changed from Email) -->
                    <div class="space-y-2">
                        <label for="username" class="text-sm font-semibold text-gray-700 ml-1">Username</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-gray-400">
                                <!-- User Icon -->
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                            </div>
                            <input type="text" id="username" required placeholder="e.g. admin" autocomplete="username"
                                class="w-full pl-11 pr-4 py-3.5 bg-gray-50 border border-gray-200 rounded-xl text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-brand-orange focus:border-transparent transition-all duration-200">
                        </div>
                    </div>

                    <!-- Password Field -->
                    <div class="space-y-2">
                        <div class="flex items-center justify-between ml-1">
                            <label for="password" class="text-sm font-semibold text-gray-700">Password</label>
                            <a href="#" class="text-sm font-semibold text-brand-orange hover:text-brand-orangeHover transition-colors">Forgot Password?</a>
                        </div>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-gray-400">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                            </div>
                            <input type="password" id="password" required placeholder="••••••••" autocomplete="current-password"
                                class="w-full pl-11 pr-12 py-3.5 bg-gray-50 border border-gray-200 rounded-xl text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-brand-orange focus:border-transparent transition-all duration-200">
                            <button type="button" id="togglePassword" class="absolute inset-y-0 right-0 pr-4 flex items-center text-gray-400 hover:text-gray-600 focus:outline-none">
                                <svg id="eyeIcon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <!-- Remember Me -->
                    <div class="flex items-center">
                        <input id="remember" type="checkbox" 
                            class="h-4 w-4 text-brand-orange border-gray-300 rounded focus:ring-brand-orange cursor-pointer">
                        <label for="remember" class="ml-2 block text-sm text-gray-600 cursor-pointer select-none">
                            Keep me logged in
                        </label>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" id="submitBtn" 
                        class="w-full bg-brand-orange hover:bg-brand-orangeHover text-white font-semibold py-3.5 px-4 rounded-xl shadow-glow transition-all duration-300 flex justify-center items-center gap-2 group transform active:scale-[0.98]">
                        <span id="btnText">Sign In</span>
                        <svg id="btnLoader" class="w-5 h-5 animate-spin hidden" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                        </svg>
                        <svg id="btnArrow" class="w-5 h-5 group-hover:translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                    </button>
                </form>

            </div>
        </div>
    </div>

    <!-- Logic Script -->
    <script>
        // Password Visibility Toggle
        const togglePassword = document.getElementById('togglePassword');
        const password = document.getElementById('password');
        const eyeIcon = document.getElementById('eyeIcon');

        togglePassword.addEventListener('click', function () {
            const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
            password.setAttribute('type', type);
            
            if (type === 'text') {
                eyeIcon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"></path>`;
            } else {
                eyeIcon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>`;
            }
        });

        // Form Submission to Secure Vercel API
        const loginForm = document.getElementById('loginForm');
        const submitBtn = document.getElementById('submitBtn');
        const btnText = document.getElementById('btnText');
        const btnLoader = document.getElementById('btnLoader');
        const btnArrow = document.getElementById('btnArrow');
        const errorMessage = document.getElementById('errorMessage');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const usernameVal = document.getElementById('username').value;
            const passwordVal = document.getElementById('password').value;

            // UI Loading State
            submitBtn.disabled = true;
            btnText.textContent = 'Authenticating...';
            btnLoader.classList.remove('hidden');
            btnArrow.classList.add('hidden');
            errorMessage.classList.add('hidden');

            try {
                // Call our secure hidden Vercel route instead of Supabase directly
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        username: usernameVal,
                        password: passwordVal
                    })
                });

                const result = await response.json();

                if (!response.ok) {
                    throw new Error(result.error || 'Authentication failed');
                }

                // Optionally, store the session token in localStorage or cookies here if needed for future requests
                if(result.session && result.session.access_token) {
                    localStorage.setItem('cargo_auth_token', result.session.access_token);
                }

                // On Success Redirect:
                window.location.href = 'dashboard.html';

            } catch (error) {
                // Handle errors
                errorMessage.classList.remove('hidden');
                document.getElementById('errorText').textContent = error.message;
                
                // Reset Button State
                submitBtn.disabled = false;
                btnText.textContent = 'Sign In';
                btnLoader.classList.add('hidden');
                btnArrow.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
