<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link rel="manifest" href="/manifest.webmanifest">
    <meta name="theme-color" content="#111827">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="ALF ERP">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
    <script src="/pwa.js" defer></script>
    <title>Redirecting to Al-Farha Cargo...</title>
    
    <!-- Primary Redirect: Instantly routes to the sign-in page -->
    <meta http-equiv="refresh" content="0; url=/app/login">
    
    <!-- Fallback Redirect: Uses JavaScript to replace the history state -->
    <script>
        window.location.replace("/app/login");
    </script>
</head>
<body style="background-color: #f3f4f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; font-family: system-ui, -apple-system, sans-serif; color: #6b7280;">
    <!-- A brief message just in case the redirect takes a fraction of a second -->
    <p>Redirecting to secure login...</p>
</body>
</html>
